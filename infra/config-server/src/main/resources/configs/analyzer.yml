server:
  port: 0

grpc:
  server:
    port: ${GRPC_SERVER_PORT:7072}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/stats}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:stats}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:stats}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analyzer
      auto-offset-reset: earliest
      enable-auto-commit: true

app:
  kafka:
    topics:
      user-actions: stats.user-actions.v1
      event-similarity: stats.events-similarity.v1

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    ru.practicum: DEBUG
