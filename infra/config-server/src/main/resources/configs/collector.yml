server:
  port: 0

grpc:
  server:
    port: 0

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 30000
        linger.ms: 5

app:
  kafka:
    topics:
      user-actions: stats.user-actions.v1

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    ru.practicum: DEBUG
